<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#020202">
<title>MetaPuppet</title>
<meta name="description" content="自分自身を、自分自身で操作する。カメラで撮影した自分の姿をリアルタイムに切り出し、VR内で自分自身を操り人形のように操作する体験作品 MetaPuppet の公式サイト。">
<meta property="og:type" content="website">
<meta property="og:title" content="MetaPuppet">
<meta property="og:description" content="自分自身を、自分自身で操作する。カメラで撮影した自分の姿をリアルタイムに切り出し、VR内で自分自身を操り人形のように操作する体験作品。">
<meta property="og:url" content="https://meta-puppet.github.io/">
<meta property="og:image" content="https://meta-puppet.github.io/assets/mp_logo.png">
<link rel="icon" type="image/png" href="assets/mp_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --bg:#020202;
  --bg-raised:#0e0e10;
  --ink:#f2f0ee;
  --ink-soft:#9a9a9e;
  --ink-faint:#6e6e73;
  --rule:#232326;
  --accent:#e78fb3;
  --accent-dim:#7a4a5c;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Hanken Grotesk","Hiragino Sans",system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

#stage{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index:0;
}
#stage.ready{ opacity:1; }
#stage{ opacity:0; transition:opacity 1.1s ease; }

.wrap{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:48px clamp(24px, 6vw, 72px) 40px;
  pointer-events:none;
}

.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-faint);
  display:flex;
  align-items:baseline;
  gap:14px;
}
.eyebrow .num{ color:var(--ink-soft); }

.hero{
  max-width:560px;
  margin:40px 0 32px;
  pointer-events:auto;
}
.hero h1{
  font-size:clamp(24px, 4.4vw, 38px);
  font-weight:700;
  line-height:1.45;
  letter-spacing:.01em;
  margin:0 0 14px;
  text-wrap:balance;
}
.hero h1 em{
  font-style:normal;
  color:var(--accent);
}
.hero p{
  font-size:14px;
  line-height:1.9;
  color:var(--ink-soft);
  margin:0;
  max-width:46ch;
  text-wrap:balance;
}

.panels{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:clamp(24px, 4vw, 56px);
  width:100%;
  max-width:860px;
  pointer-events:auto;
  flex-wrap:wrap;
}

.index{
  flex:0 1 460px;
  min-width:0;
  pointer-events:auto;
}

.team{
  flex:0 0 auto;
  width:200px;
  pointer-events:auto;
}
.team-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-top:1px solid var(--rule);
}
.team-foot{
  border-top:1px solid var(--rule);
  height:1px;
}
.team-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  filter:grayscale(1);
  opacity:.9;
}
.team-name{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink);
  line-height:1.3;
}
.index-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-top:1px solid var(--rule);
  padding-top:10px;
  margin-bottom:2px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-faint);
}

a.row{
  display:grid;
  grid-template-columns:2.4em 1fr auto;
  align-items:baseline;
  gap:18px;
  padding:20px 0;
  border-top:1px solid var(--rule);
  text-decoration:none;
  color:var(--ink);
  transition:border-color .2s ease;
}
.index-foot{
  border-top:1px solid var(--rule);
  height:1px;
}

.row-num{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--ink-faint);
  transition:color .2s ease;
}
.row-text{display:flex; flex-direction:column; gap:5px; overflow:hidden;}
.row-label{
  font-size:clamp(17px, 2.4vw, 21px);
  font-weight:600;
  letter-spacing:.005em;
  transition:transform .25s cubic-bezier(.2,.7,.2,1);
}
.row-sub{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.03em;
  color:var(--ink-soft);
}
.row-arrow{
  font-family:"IBM Plex Mono",monospace;
  color:var(--ink-faint);
  font-size:13px;
  align-self:center;
  transition:transform .2s ease, color .2s ease;
}
a.row:hover .row-num{ color:var(--accent); }
a.row:hover .row-label{ transform:translateX(6px); }
a.row:hover .row-arrow{ color:var(--accent); transform:translateX(4px); }
a.row:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }

.foot{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  color:var(--ink-faint);
  letter-spacing:.05em;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:20px;
  flex-wrap:wrap;
  pointer-events:auto;
}
.foot-links{
  display:flex;
  gap:20px;
}
.foot-links a{
  color:var(--ink-faint);
  text-decoration:none;
  transition:color .2s ease;
}
.foot-links a:hover{ color:var(--accent); }

@media (prefers-reduced-motion: reduce){
  a.row, .row-label, .row-arrow, .row-num{transition:none;}
}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="wrap">
  <div>
    <div class="eyebrow"><span class="num">MP</span><span>Meta Puppet</span></div>

    <div class="hero">
      <h1>自分自身を、<em>自分自身で</em>操作する。</h1>
      <p>カメラで撮影した自分の姿をリアルタイムに切り出し、VRの中で自分自身を操り人形のように操作する体験作品。撮影・伝送・推論・描画のすべてを自前で実装している。</p>
    </div>
  </div>

  <div class="panels">
    <nav class="index">
      <div class="index-head"><span>Reports</span><span>2026—</span></div>
      <a class="row" href="https://meta-puppet.github.io/pipeline/">
        <span class="row-num">01</span>
        <span class="row-text">
          <span class="row-label">基盤の実装で頑張ったこと</span>
          <span class="row-sub">software implementation notes — 清水</span>
        </span>
        <span class="row-arrow">→</span>
      </a>
      <a class="row" href="https://meta-puppet.github.io/experience/">
        <span class="row-num">02</span>
        <span class="row-text">
          <span class="row-label">Unity側の、体を乗っ取る実装</span>
          <span class="row-sub">experience implementation notes — 清水</span>
        </span>
        <span class="row-arrow">→</span>
      </a>
      <div class="index-foot"></div>
    </nav>

    <div class="team">
      <div class="index-head"><span>Team</span></div>
      <div class="team-row">
        <img class="team-avatar" src="assets/anji.jpg" alt="Anji Fujiwaraのアイコン">
        <span class="team-name">Anji Fujiwara</span>
      </div>
      <div class="team-row">
        <img class="team-avatar" src="assets/kosuke.jpg" alt="Kosuke Shimizuのアイコン">
        <span class="team-name">Kosuke Shimizu</span>
      </div>
      <div class="team-foot"></div>
    </div>
  </div>

  <div class="foot">
    <span>MetaPuppet</span>
    <span class="foot-links">
      <a href="https://meta-puppet.github.io/credits/">Credits</a>
    </span>
  </div>
</div>

<script src="vendor/three.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
